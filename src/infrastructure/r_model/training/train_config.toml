[model]
base_model_dir = "src/infrastructure/r_model/core/deepseek-math-7b-rl"
adapter_dir = "src/infrastructure/r_model/core/deepseek-math-farma"
output_dir = "src/infrastructure/r_model/training/checkpoints/farma-sft"

[lora]
r = 16
lora_alpha = 32
lora_dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[training]
per_device_train_batch_size = 2
gradient_accumulation_steps = 8
learning_rate = 2e-4
max_steps = 1000
save_steps = 100
logging_steps = 10
